server:
  port: 8080
spring:
  application:
    name: "MS_Solicitudes"
  profiles:
    active: "devkpika"
  r2dbc:
    url: ${SPRING_DATASOURCE_LOAN_URL}
    username: "${SPRING_DATASOURCE_USERNAME}"
    password: "${SPRING_DATASOURCE_PASSWORD}"
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: "30m"
  main:
    allow-bean-definition-overriding: true
security:
  jwt:
    private-key-path: ${JWT_PRAGMA_PRIVATE_KEY}
    public-key-path: ${JWT_PRAGMA_PUBLIC_KEY}
    expiration: 3600
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
logging:
  level:
    org.springframework.web: "DEBUG"
    org.springframework.http.converter.json: "DEBUG"
    com.fasterxml.jackson.databind: "DEBUG"
adapter:
  sqs:
    region: "${AWS_REGION}"
    queueUrl: "${SQS_ENDPOINT}"
    endpoint: "https://sqs.us-east-1.amazonaws.com"
  restconsumer:
    timeout: 5000
    url: "${ENDPOINT_MS_AUTH_DOCKER}"
entrypoint:
  sqs:
    region: "${AWS_REGION}"
    endpoint: "https://sqs.us-east-1.amazonaws.com"
    queueUrl: "${SQS_ENDPOINT_LISTENER}"
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 10
    numberOfThreads: 1
resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
aws:
  region: "${AWS_REGION}"
